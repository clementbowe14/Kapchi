name: Production readiness controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-artifacts:
    name: Validate deployment and runbook artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run deployment and runbook tests
        run: node --test scripts/*.test.mjs
      - name: Validate Vercel backend configuration
        run: node scripts/validate-deployment.mjs
      - name: Validate alert definitions
        run: node scripts/validate-alerts.mjs
      - name: Validate provider canary contracts
        run: node scripts/provider-canary.mjs validate-contracts
      - name: Validate runbooks
        run: node scripts/validate-runbooks.mjs
      - name: Validate launch record template shape
        run: node scripts/validate-launch-record.mjs --template --record docs/runbooks/templates/launch-record.json

  secrets:
    name: Gitleaks tracked tree and pull-request history
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan with pinned Gitleaks action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
