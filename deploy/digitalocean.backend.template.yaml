# Operator template. Replace placeholder names through the DigitalOcean control
# plane; never put secret values in this file. Automatic promotion is disabled.
name: kapchi-production
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: AUTOSCALE_FAILED

domains:
  - domain: PRODUCTION_API_DOMAIN
    type: PRIMARY

services:
  - name: kapchi-api
    image: &backend_image
      registry_type: DOCR
      registry: DOCR_REGISTRY_NAME
      repository: kapchi-backend
      digest: RELEASE_IMAGE_DIGEST
      deploy_on_push:
        enabled: false
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 4000
    run_command: node dist/server.js
    routes:
      - path: /
    health_check:
      http_path: /ready
      port: 4000
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_health_check:
      http_path: /health
      port: 4000
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6
    termination:
      drain_seconds: 30
      grace_period_seconds: 90
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
      - rule: REQUEST_DURATION_P95_MS
        operator: GREATER_THAN
        value: 2000
        window: FIVE_MINUTES
    envs: &backend_env
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: HOST
        value: 0.0.0.0
        scope: RUN_TIME
        type: GENERAL
      - key: PORT
        value: "4000"
        scope: RUN_TIME
        type: GENERAL
      - key: RELEASE_SHA
        value: RELEASE_SHA
        scope: RUN_TIME
        type: GENERAL
      - key: RELEASE_IMAGE_DIGEST
        value: RELEASE_IMAGE_DIGEST
        scope: RUN_TIME
        type: GENERAL
      - key: PRODUCTION_CLIENT_URL
        value: PRODUCTION_CLIENT_URL
        scope: RUN_TIME
        type: GENERAL
      - key: PRODUCTION_API_URL
        value: PRODUCTION_API_URL
        scope: RUN_TIME
        type: GENERAL
      - key: CORS_ALLOWED_ORIGINS
        value: PRODUCTION_CLIENT_URL
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_SSL_MODE
        value: require
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URL
        value: DATABASE_URL_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_DIRECT_URL
        value: DATABASE_DIRECT_URL_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        value: REDIS_URL_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_PUBLISHABLE_KEY
        value: CLERK_PUBLISHABLE_KEY_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_SECRET_KEY
        value: CLERK_SECRET_KEY_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CLERK_JWT_ISSUER
        value: CLERK_JWT_ISSUER
        scope: RUN_TIME
        type: GENERAL
      - key: CLERK_JWKS_URL
        value: CLERK_JWKS_URL
        scope: RUN_TIME
        type: GENERAL
      - key: CLERK_JWT_AUDIENCE
        value: CLERK_JWT_AUDIENCE
        scope: RUN_TIME
        type: GENERAL
      - key: CLERK_AUTHORIZED_PARTIES
        value: PRODUCTION_CLIENT_URL
        scope: RUN_TIME
        type: GENERAL
      - key: CLERK_WEBHOOK_SECRET
        value: CLERK_WEBHOOK_SECRET_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        value: STRIPE_SECRET_KEY_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        value: STRIPE_WEBHOOK_SECRET_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_API_VERSION
        value: STRIPE_API_VERSION
        scope: RUN_TIME
        type: GENERAL
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        value: STRIPE_CHECKOUT_SUCCESS_URL
        scope: RUN_TIME
        type: GENERAL
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: STRIPE_CHECKOUT_CANCEL_URL
        scope: RUN_TIME
        type: GENERAL
      - key: BLOB_READ_WRITE_TOKEN
        value: BLOB_READ_WRITE_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ASSET_UPLOAD_CALLBACK_SECRET_CURRENT
        value: ASSET_UPLOAD_CALLBACK_SECRET_CURRENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ASSET_UPLOAD_CALLBACK_KEY_ID_CURRENT
        value: ASSET_UPLOAD_CALLBACK_KEY_ID_CURRENT
        scope: RUN_TIME
        type: GENERAL
      - key: MESSAGE_DELIVERY_URL
        value: MESSAGE_DELIVERY_URL
        scope: RUN_TIME
        type: GENERAL
      - key: MESSAGE_DELIVERY_TOKEN
        value: MESSAGE_DELIVERY_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MESSAGE_WEBHOOK_SECRET
        value: MESSAGE_WEBHOOK_SECRET_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MESSAGE_FROM_EMAIL
        value: MESSAGE_FROM_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: MESSAGE_CANARY_DESTINATION
        value: MESSAGE_CANARY_DESTINATION_SECRET
        scope: RUN_TIME
        type: SECRET

workers:
  - name: kapchi-worker
    image: *backend_image
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: node dist/worker.js
    termination:
      grace_period_seconds: 120
    envs: *backend_env

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image: *backend_image
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: node dist/database/migrate.js apply && node dist/database/migrate.js check
    envs: *backend_env
  - name: operations-health
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *"
      time_zone: UTC
    image: *backend_image
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: node dist/operations/health.js
    envs: *backend_env
